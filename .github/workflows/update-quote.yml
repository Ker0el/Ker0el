name: Update Quote

on:
  schedule:
    - cron: '0 */6 * * *'  # every 6 hours
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Fetch quote and update README
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import urllib.request

          req = urllib.request.Request(
              'https://uapis.cn/api/v1/saying',
              headers={'User-Agent': 'quote-bot'},
          )
          with urllib.request.urlopen(req, timeout=30) as resp:
              quote = json.load(resp)['text'].strip()

          start, end = '<!-- QUOTE:START -->', '<!-- QUOTE:END -->'
          section = start + '<div align="center"><i>「' + quote + '」</i></div>' + end

          path = pathlib.Path('README.md')
          text = path.read_bytes().decode('utf-8')
          i, j = text.find(start), text.find(end)
          if i < 0 or j < 0:
              raise SystemExit('quote markers not found in README.md')

          path.write_bytes((text[:i] + section + text[j + len(end):]).encode('utf-8'))
          print('quote updated:', quote)
          PY

      - name: Commit & push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add README.md
          git diff --staged --quiet || git commit -m '💬 Update daily quote'
          git push
